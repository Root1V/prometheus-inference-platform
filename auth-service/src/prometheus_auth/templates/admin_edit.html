<!DOCTYPE html>
<!--
  Prometheus Admin — Edit client page
  Implements: specs/015-auth-service-dashboard.md — AC-20
  All user-supplied values are Jinja2 auto-escaped. No external CDN dependencies.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prometheus Admin — Edit Client</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('prometheus-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/admin/ui/static/admin.css">
</head>
<body>
  <!-- ── Header ── -->
  <header class="site-header">
    <div class="header-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2c-1.5 3-2.5 5.5-2 8-.8-.8-1.3-2-1.3-3.2C7 9 6 11.5 6 14a6 6 0 0 0 12 0c0-3-1.5-5.5-3-7-.2 1.5-.8 2.8-1.8 3.7C13.5 8.5 13 5.2 12 2z"/>
      </svg>
      Prometheus Admin
    </div>
    <div class="header-actions">
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle dark / light mode"
      >
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="1"  y1="12" x2="3"  y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <a href="/admin/ui/dashboard" class="btn btn-ghost">← Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="subpage-wrap">
      <h2 style="margin-bottom:1rem; color:var(--color-primary); font-size:1.1rem">
        Edit Client
      </h2>

      <p style="font-size:0.8rem; color:var(--color-muted); margin-bottom:1.25rem">
        <strong>ID:</strong> <code class="client-id">{{ client.client_id }}</code> &nbsp;
        <strong>Role:</strong> <span class="badge badge-role">{{ client.role.value }}</span>
      </p>

      {% if error %}
      <p class="msg msg-error" role="alert">{{ error }}</p>
      {% endif %}

      <div class="panel">
        <div class="panel-body" style="padding-top:1rem">
          <form method="post" action="/admin/ui/clients/{{ client.client_id }}/edit">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="e-name">Name * <span style="font-weight:400;color:var(--color-muted)">— unique technical ID (appears in logs)</span></label>
            <input
              id="e-name"
              name="client_name"
              type="text"
              required
              maxlength="255"
              placeholder="e.g. pipeline-agent-001"
              value="{{ client.client_name }}"
            >

            <label for="e-label">Label <span style="font-weight:400;color:var(--color-muted)">— optional owner / team tag (informational only)</span></label>
            <input
              id="e-label"
              name="label"
              type="text"
              maxlength="255"
              placeholder="e.g. equipo-data, prod, Pablo"
              value="{{ client.label if client.label else '' }}"
            >

            <label for="e-ttl">Token TTL (seconds, 60–86400)</label>
            <input
              id="e-ttl"
              name="token_ttl_seconds"
              type="number"
              min="60"
              max="86400"
              required
              value="{{ client.token_ttl_seconds }}"
            >

            <fieldset class="scope-group">
              <legend>Scopes *</legend>
              <div class="scope-grid">
              {% for scope in valid_scopes %}
              <label class="scope-card{% if scope in client.scopes %} checked{% endif %}">
                <input
                  type="checkbox"
                  name="allowed_scopes"
                  value="{{ scope }}"
                  {% if scope in client.scopes %}checked{% endif %}
                  onchange="toggleScopeCard(this)"
                >
                <div class="scope-card-header">
                  <span class="scope-check-icon"></span>
                  <span class="scope-name">{{ scope }}</span>
                </div>
                {% if scope in scope_descriptions %}
                <span class="scope-hint">{{ scope_descriptions[scope] }}</span>
                {% endif %}
              </label>
              {% endfor %}
              </div>
            </fieldset>

            <div>
              <label for="ec-model-scopes">Model access <span style="font-weight:400;color:var(--color-muted)">— space-separated model IDs from registry.yaml. Empty = no model access (deny-by-default, RM-07) even with inference:read.</span></label>
              <input id="ec-model-scopes" name="model_scopes" type="text" placeholder="e.g. llama3-8b-q4-local qwen-coder-7b"
                     value="{{ model_scopes }}">
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-sm">Save changes</button>
              <a href="/admin/ui/dashboard" class="btn btn-sm">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script>
    var btn  = document.getElementById('theme-toggle');
    var moon = document.getElementById('icon-moon');
    var sun  = document.getElementById('icon-sun');

    function applyTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      moon.style.display = dark ? 'none' : '';
      sun.style.display  = dark ? ''     : 'none';
    }

    applyTheme(document.documentElement.classList.contains('dark'));

    btn.addEventListener('click', function () {
      var isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('prometheus-theme', isDark ? 'light' : 'dark');
      applyTheme(!isDark);
    });

    // ── Scope card toggle ─────────────────────────────────────────────────
    function toggleScopeCard(checkbox) {
      var card = checkbox.closest('.scope-card');
      if (card) { card.classList.toggle('checked', checkbox.checked); }
    }
  </script>
</body>
</html>

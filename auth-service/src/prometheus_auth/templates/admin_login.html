<!DOCTYPE html>
<!--
  Prometheus Admin — Login page
  Implements: specs/015-auth-service-dashboard.md — AC-12, AC-13, AC-14
  All user-supplied values are Jinja2 auto-escaped. No external CDN dependencies.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prometheus Admin — Sign in</title>
  <!--
    FOUC prevention: apply saved theme before CSS is parsed.
    Contains only a localStorage read and a DOM class set — no eval, no external src.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('prometheus-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/admin/ui/static/admin.css">
</head>
<body class="login-page">
  <div class="card">
    <div class="card-header">
      <h1>
        <!-- Flame icon — inline SVG, no external deps -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2c-1.5 3-2.5 5.5-2 8-.8-.8-1.3-2-1.3-3.2C7 9 6 11.5 6 14a6 6 0 0 0 12 0c0-3-1.5-5.5-3-7-.2 1.5-.8 2.8-1.8 3.7C13.5 8.5 13 5.2 12 2z"/>
        </svg>
        Prometheus Admin
      </h1>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle dark / light mode"
      >
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="1"  y1="12" x2="3"  y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    {% if error %}
    <p class="msg msg-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/admin/ui/login">
      <label for="ak">Admin API Key</label>
      <input
        id="ak"
        name="api_key"
        type="password"
        autocomplete="current-password"
        required
        autofocus
      >
      <button type="submit" class="btn-submit">Sign in</button>
    </form>
  </div>

  <script>
    var btn  = document.getElementById('theme-toggle');
    var moon = document.getElementById('icon-moon');
    var sun  = document.getElementById('icon-sun');

    function applyTheme(dark) {
      document.documentElement.classList.toggle('dark', dark);
      moon.style.display = dark ? 'none' : '';
      sun.style.display  = dark ? ''     : 'none';
    }

    applyTheme(document.documentElement.classList.contains('dark'));

    btn.addEventListener('click', function () {
      var isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('prometheus-theme', isDark ? 'light' : 'dark');
      applyTheme(!isDark);
    });
  </script>
</body>
</html>

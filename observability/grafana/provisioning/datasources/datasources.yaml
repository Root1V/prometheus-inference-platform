# observability/grafana/provisioning/datasources/datasources.yaml
# Auto-provisioned datasources for Prometheus ops.
# Loki — structured JSON logs from gateway, auth-service, manager.
# Tempo — distributed traces (when OTEL instrumentation is added).
# The derivedFields rule correlates Loki log lines that contain a trace_id
# field (structlog JSON) directly to Tempo spans — see spec-021 AC-11.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    isDefault: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: http://tempo:3200/tempo/api/traces/${__value.raw}
          datasourceUid: tempo
          urlDisplayLabel: "Open trace in Tempo"
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: ""
      search:
        hide: false
      nodeGraph:
        enabled: true
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      lokiSearch:
        datasourceUid: loki
    editable: false

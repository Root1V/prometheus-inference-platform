[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "structlog>=24.1",
    "python-multipart>=0.0.24",
    "jinja2>=3.1.6",
    "prometheus-telemetry",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "respx>=0.21",
    "cryptography>=42",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20250915",
    "fakeredis>=2.34.1",
    "types-python-jose>=3.5.0.20250531",
]

[tool.uv.sources]
prometheus-telemetry = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

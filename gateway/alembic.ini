# Alembic configuration for the gateway database — docs/roadmap.md RM-68.
#
# The database URL is NOT set here on purpose: migrations/env.py reads it from
# the same GATEWAY_DB_URL the application uses, so the CLI and the startup path
# can never disagree about which database they are migrating.
#
#   uv run --project gateway alembic upgrade head
#   uv run --project gateway alembic revision --autogenerate -m "what changed"
#
# Run those from the gateway/ directory (or pass -c gateway/alembic.ini).

[alembic]
# %(here)s — resolved against this file, so migrations run the same whether
# invoked from the repo root, from gateway/, or in-process from create_tables().
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

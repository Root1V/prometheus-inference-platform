# podman-compose.yml
# Ubuntu 24.04 / NVIDIA DGX Spark / rootless Podman compatible
#
# Main changes vs RHEL version:
# - Removed obsolete top-level "version".
# - Starts dependency services first: redis.
# - Uses project-local log directories by default to avoid rootless Podman
#   permission issues with /var/log/prometheus.
# - Keeps Podman-compatible container names expected by --requires.
#
# Before running:
#   mkdir -p runtime/container-logs runtime/logs
#   podman-compose -f podman-compose.yml down || true
#   podman rm -f prometheus-redis prometheus-auth prometheus-manager prometheus-gateway 2>/dev/null || true
#   podman-compose -f podman-compose.yml up --build -d

services:

  # ── Redis: internal dependency ───────────────────────────────────────────────
  redis:
    image: docker.io/redis:7-alpine
    container_name: prometheus-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - prometheus_net

  # ── Prometheus Auth Service ─────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: prometheus-auth:latest
    container_name: prometheus-auth
    restart: unless-stopped

    labels:
      prometheus.service: auth-service

    ports:
      - "${AUTH_BIND_HOST:-127.0.0.1}:9000:9000"

    env_file:
      - ./auth-service/.env

    environment:
      - TZ=America/Lima
      - AUTH_TLS_CERT_FILE=/run/secrets/auth_tls.crt
      - AUTH_TLS_KEY_FILE=/run/secrets/auth_tls.key

    volumes:
      - type: bind
        source: ${JWT_PRIVATE_KEY_HOST_PATH:-./keys/private.pem}
        target: /run/secrets/jwt_private_key.pem
        read_only: true
      - type: bind
        source: ${JWT_PUBLIC_KEY_HOST_PATH:-./keys/public.pem}
        target: /run/secrets/jwt_public_key.pem
        read_only: true
      - type: bind
        source: ${AUTH_TLS_CERT_HOST_PATH:-./auth-service/certs/dev.crt}
        target: /run/secrets/auth_tls.crt
        read_only: true
      - type: bind
        source: ${AUTH_TLS_KEY_HOST_PATH:-./auth-service/certs/dev.key}
        target: /run/secrets/auth_tls.key
        read_only: true
      - type: bind
        source: ${AUTH_DB_HOST_PATH:-./data/auth-service}
        target: /data

    logging:
      driver: k8s-file
      options:
        path: ${PROMETHEUS_CONTAINER_LOG_HOST_PATH:-./runtime/container-logs}/auth-service.log

    depends_on:
      - redis

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, ssl, os; url = ('https' if os.getenv('AUTH_TLS_CERT_FILE') else 'http') + '://localhost:9000/health'; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen(url, context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - prometheus_net

  # ── Prometheus Manager REST API ─────────────────────────────────────────────
  manager:
    build:
      context: .
      dockerfile: runtime/manager/api/Dockerfile
    image: prometheus-manager:latest
    container_name: prometheus-manager
    restart: unless-stopped

    labels:
      prometheus.service: manager

    ports:
      - "8090:8090"

    environment:
      - TZ=America/Lima
      - PROMETHEUS_LLAMA_BIND_HOST=${PROMETHEUS_LLAMA_BIND_HOST:-0.0.0.0}
      - PMGR_PROXY_HOST=${PMGR_PROXY_HOST:-host.containers.internal}
      - PMGR_JWKS_URL=https://auth-service:9000/.well-known/jwks.json
      - PMGR_JWKS_TLS_VERIFY=false
      - PMGR_REGISTRY_PATH=/data/registry.yaml
      # RM-91: telemetry goes to whatever collector the deployment points at
      # (Argus runs ours). Unset here on purpose — an endpoint naming a
      # container we no longer ship is worse than none.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}

    volumes:
      - type: bind
        source: ./runtime/manager/registry.yaml
        target: /data/registry.yaml
        read_only: true

    logging:
      driver: k8s-file
      options:
        path: ${PROMETHEUS_CONTAINER_LOG_HOST_PATH:-./runtime/container-logs}/manager.log

    depends_on:
      - redis
      - auth-service

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - prometheus_net

  # ── Prometheus Gateway ──────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: prometheus-gateway:latest
    container_name: prometheus-gateway
    restart: unless-stopped

    labels:
      prometheus.service: gateway

    ports:
      - "8000:8000"

    env_file:
      - ./gateway/.env

    environment:
      - TZ=America/Lima
      - GATEWAY_TLS_CERT_FILE=/run/secrets/gateway.crt
      - GATEWAY_TLS_KEY_FILE=/run/secrets/gateway.key
      - UI_ENABLED=true
      - AUTH_SERVICE_TOKEN_URL=https://auth-service:9000/oauth2/token
      - AUTH_SERVICE_TLS_VERIFY=false

    volumes:
      - type: bind
        source: ${JWT_PUBLIC_KEY_HOST_PATH:-./gateway/certs/jwt_public.pem}
        target: /run/secrets/jwt_public_key.pem
        read_only: true
      - type: bind
        source: ./runtime/models/registry.yaml
        target: /app/config/registry.yaml
        read_only: true
      - type: bind
        source: ${TLS_CERT_HOST_PATH:-./gateway/certs/dev.crt}
        target: /run/secrets/gateway.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_HOST_PATH:-./gateway/certs/dev.key}
        target: /run/secrets/gateway.key
        read_only: true

    logging:
      driver: k8s-file
      options:
        path: ${PROMETHEUS_CONTAINER_LOG_HOST_PATH:-./runtime/container-logs}/gateway.log

    depends_on:
      - redis
      - auth-service
      - manager

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - prometheus_net

networks:
  prometheus_net:
    driver: bridge


# podman-compose.yml
# Implements: memory/specs/004-podman-containerization.md — AC-4, AC-5, AC-6, AC-8
#
# Usage:
#   # Copy and edit the correct env file for your platform first:
#   cp gateway/.env.podman.example gateway/.env
#
#   # Build and start (from repo root):
#   podman compose up --build -d
#
#   # Stop:
#   podman compose down
#
# Platform notes:
#   macOS (Podman Desktop):
#     LLAMA_CPP_URL=http://host.docker.internal:8080
#   RHEL 9.7 rootless Podman:
#     LLAMA_CPP_URL=http://host.containers.internal:8080

version: "3.9"

services:

  # ── Prometheus Gateway ──────────────────────────────────────────────────────
  gateway:
    # AC-1: built from gateway/Dockerfile (multi-stage)
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: prometheus-gateway:latest
    container_name: prometheus-gateway
    restart: unless-stopped

    labels:
      prometheus.service: gateway

    ports:
      # Gateway listens on 8000 — exposed to host for client access
      - "8000:8000"

    env_file:
      # Contains JWT_ISSUER, JWT_PUBLIC_KEY_FILE or JWT_JWKS_URL, LLAMA_CPP_URL, etc.
      # AC-9: no secrets baked into the image — injected here at runtime only
      - ./gateway/.env

    volumes:
      # Mount JWT public key at runtime — never COPY into the image layer
      # Path inside container must match JWT_PUBLIC_KEY_FILE in .env
      - type: bind
        source: ${JWT_PUBLIC_KEY_HOST_PATH:-./gateway/certs/jwt_public.pem}
        target: /run/secrets/jwt_public_key.pem
        read_only: true

      # Mount model registry — used only as fallback when ADMIN_DASHBOARD_ENABLED
      # is not set (RM-20: node topology otherwise lives in the dashboard's
      # Nodes section / auth-service's node registry, not a static file).
      - type: bind
        source: ./runtime/models/registry.yaml
        target: /app/config/registry.yaml
        read_only: true

      # TLS certificate and key — memory/specs/013-web-chat-ui-proxy.md — AC-14, AC-15
      # Host paths come from root .env (TLS_CERT_HOST_PATH / TLS_KEY_HOST_PATH).
      # The container always sees them at /run/secrets/gateway.crt and .key.
      - type: bind
        source: ${TLS_CERT_HOST_PATH:-./gateway/certs/dev.crt}
        target: /run/secrets/gateway.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_HOST_PATH:-./gateway/certs/dev.key}
        target: /run/secrets/gateway.key
        read_only: true

    # Override TLS env vars so the entrypoint finds the certs at the container-internal paths.
    # gateway/.env keeps the host paths (used by start.sh for bare-metal).
    environment:
      # RM-93: how this process identifies itself to whoever collects telemetry
      # (Argus). OTEL_SERVICE_NAME names the component; the namespace groups the
      # components under one platform, which is what makes "how is Prometheus
      # doing?" answerable rather than only "how is gateway doing?".
      # Unset endpoint = export nowhere, so a deployment opts in by configuring
      # one rather than by us guessing a hostname.
      - OTEL_SERVICE_NAME=gateway
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=prometheus-inference-platform,argus.component.role=api,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-podman}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - TZ=America/Lima
      - GATEWAY_TLS_CERT_FILE=/run/secrets/gateway.crt
      - GATEWAY_TLS_KEY_FILE=/run/secrets/gateway.key
      # UI — memory/specs/013-web-chat-ui-proxy.md
      - UI_ENABLED=true
      - AUTH_SERVICE_TOKEN_URL=https://auth-service:9000/oauth2/token
      - AUTH_SERVICE_TLS_VERIFY=false

    depends_on:
      redis:
        condition: service_healthy
      # service_started (not service_healthy): gateway has non-fatal initial_sync_failed
      # so it can start before manager is healthy and retry on its own poll loop.
      manager:
        condition: service_started

    healthcheck:
      # AC-5: health check passes within 30 s
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    # AC-7: non-root user enforced in the Dockerfile (USER prometheus)
    # No need to set user here — Dockerfile already handles it

    # Container stdout/stderr, read with `podman logs`. RM-91 removed the
    # shipper that used to forward these; Argus collect them now.
    logging:
      driver: k8s-file
      options:
        path: ${CONTAINER_LOG_HOST_PATH:-./runtime/container-logs}/gateway.log

    networks:
      - prometheus_net

  # ── Prometheus Auth Service ─────────────────────────────────────────────────
  # Implements: memory/specs/005-auth-service.md
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: prometheus-auth:latest
    container_name: prometheus-auth
    restart: unless-stopped

    labels:
      prometheus.service: auth-service

    ports:
      # AC-12: bound to loopback by default — use AUTH_BIND_HOST=0.0.0.0 only
      # when dashboard access from another host is needed (combine with TLS).
      # See memory/specs/017-auth-service-tls.md — AC-12, AC-20
      - "${AUTH_BIND_HOST:-127.0.0.1}:9000:9000"

    env_file:
      - ./auth-service/.env

    environment:
      # RM-93: how this process identifies itself to whoever collects telemetry
      # (Argus). OTEL_SERVICE_NAME names the component; the namespace groups the
      # components under one platform, which is what makes "how is Prometheus
      # doing?" answerable rather than only "how is auth-service doing?".
      # Unset endpoint = export nowhere, so a deployment opts in by configuring
      # one rather than by us guessing a hostname.
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=prometheus-inference-platform,argus.component.role=api,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-podman}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - TZ=America/Lima
      # AC-14: container-internal paths for TLS cert/key
      - AUTH_TLS_CERT_FILE=/run/secrets/auth_tls.crt
      - AUTH_TLS_KEY_FILE=/run/secrets/auth_tls.key

    volumes:
      # Private key — auth-service ONLY. Never shared with gateway.
      - type: bind
        source: ${JWT_PRIVATE_KEY_HOST_PATH:-./keys/private.pem}
        target: /run/secrets/jwt_private_key.pem
        read_only: true
      # Public key — shared with gateway via the same host file
      - type: bind
        source: ${JWT_PUBLIC_KEY_HOST_PATH:-./keys/public.pem}
        target: /run/secrets/jwt_public_key.pem
        read_only: true
      # AC-13: TLS cert and key — defaults to self-signed dev cert
      - type: bind
        source: ${AUTH_TLS_CERT_HOST_PATH:-./auth-service/certs/dev.crt}
        target: /run/secrets/auth_tls.crt
        read_only: true
      - type: bind
        source: ${AUTH_TLS_KEY_HOST_PATH:-./auth-service/certs/dev.key}
        target: /run/secrets/auth_tls.key
        read_only: true
      # Persistent SQLite database — survives container restarts and rebuilds
      - type: bind
        source: ${AUTH_DB_HOST_PATH:-./data/auth-service}
        target: /data

    # Container stdout/stderr, read with `podman logs`. RM-91 removed the
    # shipper that used to forward these; Argus collect them now.
    logging:
      driver: k8s-file
      options:
        path: ${CONTAINER_LOG_HOST_PATH:-./runtime/container-logs}/auth-service.log

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      # AC-15: selects https when AUTH_TLS_CERT_FILE is set, http otherwise
      test: ["CMD", "python", "-c",
             "import urllib.request, ssl, os; url = ('https' if os.getenv('AUTH_TLS_CERT_FILE') else 'http') + '://localhost:9000/health'; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen(url, context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - prometheus_net

  # ── Prometheus Manager REST API ─────────────────────────────────────────────
  # Implements: memory/specs/008-llama-server-manager.md — AC-11
  #
  # Runs only pmgr-api — the REST API that the gateway polls for live state (built from the
  # prometheus-manager-api package only, no Textual/Rich — see runtime/manager/api/Dockerfile).
  # The TUI (pmgr tui) runs on bare-metal and is NOT containerised.
  #
  # The registry.yaml is bind-mounted from the host so TUI writes are immediately
  # visible to the API (registry.reload() is called on every request).
  # llama-server health is probed via http://host.containers.internal:<port>/health
  # because psutil cannot see host processes from inside a container.
  manager:
    build:
      context: .
      dockerfile: runtime/manager/api/Dockerfile
    image: prometheus-manager:latest
    container_name: prometheus-manager
    restart: unless-stopped

    labels:
      prometheus.service: manager

    ports:
      # Manager API on 8090 — reachable by the gateway container on the internal network
      # and from the host for debugging (pmgr CLI / manual curl)
      - "8090:8090"

    environment:
      # RM-93: how this process identifies itself to whoever collects telemetry
      # (Argus). OTEL_SERVICE_NAME names the component; the namespace groups the
      # components under one platform, which is what makes "how is Prometheus
      # doing?" answerable rather than only "how is manager-api doing?".
      # Unset endpoint = export nowhere, so a deployment opts in by configuring
      # one rather than by us guessing a hostname.
      - OTEL_SERVICE_NAME=manager-api
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=prometheus-inference-platform,argus.component.role=api,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-podman}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - TZ=America/Lima
      # Container mode: use HTTP health probing instead of psutil.
      # Source of truth: root .env (PMGR_PROXY_HOST). Default: host.containers.internal.
      - PMGR_PROXY_HOST=${PMGR_PROXY_HOST:-host.containers.internal}
      # Auth-service JWKS on the internal network
      - PMGR_JWKS_URL=https://auth-service:9000/.well-known/jwks.json
      - PMGR_JWKS_TLS_VERIFY=false
      # registry.yaml is mounted at /data/registry.yaml
      - PMGR_REGISTRY_PATH=/data/registry.yaml

    volumes:
      # Bind-mount the host registry.yaml as read-only.
      # The TUI writes to this file on bare-metal; the API reads it via reload().
      - type: bind
        source: ./runtime/manager/registry.yaml
        target: /data/registry.yaml
        read_only: true

    # Container stdout/stderr, read with `podman logs`. RM-91 removed the
    # shipper that used to forward these; Argus collect them now.
    logging:
      driver: k8s-file
      options:
        path: ${CONTAINER_LOG_HOST_PATH:-./runtime/container-logs}/manager.log

    depends_on:
      # service_started (not service_healthy): manager validates JWTs on each request,
      # not at startup — it can start before auth-service is fully healthy and retry.
      auth-service:
        condition: service_started

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - prometheus_net

  redis:
    image: docker.io/redis:7-alpine
    container_name: prometheus-redis
    restart: unless-stopped

    # AC-8: Redis has NO host port binding — internal-only
    # "6379:6379" is intentionally absent
    expose:
      - "6379"

    command: redis-server --save "" --appendonly no

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - prometheus_net

networks:
  prometheus_net:
    driver: bridge


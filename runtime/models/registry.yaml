# Model registry — Prometheus Runtime
# See memory/specs/001-gateway-core.md and llama-cpp.instructions.md
#
# Fields:
#   id             - stable identifier used in API requests (e.g. in "model" field)
#   path           - absolute path to the .gguf weights file on the bare-metal host
#   context_length - maximum context window in tokens (used to validate max_tokens)
#   family         - model family (used to select prompt template)
#   quantization   - quantization format label (informational)
#
# Model weights are NOT stored in the repo. Only metadata lives here.
# Add your models below following the same format.

models:
  # ── HPE DL380 / RHEL 9.7 (path: /srv/models/) ────────────────────────────
  - id: "llama3-8b-q4"
    path: "/srv/models/Meta-Llama-3-8B-Instruct.Q4_K_M.gguf"
    context_length: 8192
    family: llama3
    quantization: Q4_K_M

  - id: "mistral-7b-q4"
    path: "/srv/models/Mistral-7B-Instruct-v0.3.Q4_K_M.gguf"

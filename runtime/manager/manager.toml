# Prometheus Manager configuration — manager.toml
# Copy to manager.toml and edit. All settings have defaults.
# Implements: memory/specs/008-llama-server-manager.md

[api]
# Manager REST API bind address and port.
# 0.0.0.0 allows containerised services (e.g. gateway in Podman) to reach the API via host.containers.internal.
# JWT authentication on every endpoint is the security boundary for the REST API.
host = "0.0.0.0"
port = 8090
# JWKS URL for validating JWTs issued by the Auth Service.
# 127.0.0.1 rather than localhost on purpose: localhost also resolves to ::1, and
# any other service on the machine bound to 0.0.0.0:9000 answers there first. When
# that happens the manager fetches something that isn't a JWKS and rejects every
# token as "invalid or expired", which points the investigation at credentials
# instead of at the port. Overridden by PMGR_JWKS_URL in container deployments.
jwks_url = "http://127.0.0.1:9000/.well-known/jwks.json"
# Host alias used to reach llama-server processes from this Manager instance.
# Leave empty when running bare-metal (Manager and llama-server on the same host).
# Set to "host.containers.internal" when Manager runs inside Podman/Docker so it
# can reach bare-metal llama-server via the container→host bridge.
# Overridden at runtime by the PMGR_PROXY_HOST environment variable (e.g. podman-compose.yml).
proxy_host = ""

[server]
# Path to the llama-server binary
binary = "~/.local/bin/llama-server"
# Host is always forced to 127.0.0.1 regardless of this setting (AC-19)
host = "127.0.0.1"
# Seconds to wait for /health to return 200 before killing the process (AC-5)
start_timeout_s = 60
# Seconds to wait after SIGTERM before sending SIGKILL (AC-7)
stop_timeout_s = 10
# Log files directory
log_dir = "runtime/logs"
# PID files directory
pid_dir = "runtime/run"

# PRM-134: this node is the fleet coordinator — it owns the list *of* nodes.
#
# `manager-api` runs on every node, so "the manager owns the fleet" needs an
# answer to which manager, and exactly one says yes here. `local` is that one
# because it is the node that has always been there and the one the gateway
# already reaches. Every other node (see manager-lab.toml) leaves this false and
# answers the fleet endpoints with a 409 explaining why.
#
# fleet.db is a database of its own, never registry.db below: that one is
# per-node — the models and instances on *this* host — and the node list is
# fleet-level with exactly one of it. Keeping them apart is what lets a node's
# local state be wiped and rebuilt, which is routine in Kubernetes and Nomad and
# would destroy the fleet registry if they shared a file.
[fleet]
coordinator = true
path = "runtime/manager/fleet.db"

[registry]
# Path to the manager registry.db — a SQLite database, source of truth for
# models (RM-49; a legacy registry.yaml next to this path is imported once,
# automatically, the first time this path doesn't exist yet).
path = "runtime/manager/registry.db"

[downloads]
# Directory where GGUF files are downloaded
dir = "runtime/models/downloads"
# Environment variable name containing the HuggingFace token
hf_token_env = "HF_TOKEN"
# PEM bundle for corporate TLS interception (e.g. Zscaler or similar proxy).
# Leave empty to use the system trust store (works on machines without a proxy).
# See memory/specs/011-downloads-view-redesign.md — AC-22–AC-25
ca_bundle = ""

[dashboard]
# TUI refresh interval in seconds (AC-26)
refresh_interval_s = 2

[tui]
theme = "catppuccin-latte"
# Log file for TUI session. Stdout is silenced while Textual owns the terminal;
# logs are written here instead. Follow with: tail -f runtime/logs/manager.log
log_file_path = "runtime/logs/manager.log"

[tracing]
# OTLP/HTTP endpoint for distributed traces.
# TUI corre en bare-metal — Tempo expone 4318 al host vía port-forward de Podman.
otlp_endpoint = "http://localhost:4318"
# Pon disabled = true para apagar trazas sin cambiar el endpoint.
disabled = false

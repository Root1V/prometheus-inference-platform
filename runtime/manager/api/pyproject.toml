[project]
name = "prometheus-manager-api"
version = "0.1.0"
description = "Prometheus Manager REST API — containerized, gateway-facing backend registry service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "click>=8.1",
    "structlog>=25.5.0",
    "prometheus-telemetry",
    "prometheus-manager-core",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-jose>=3.5.0.20260408",
]

[tool.uv.sources]
prometheus-telemetry = { workspace = true }
prometheus-manager-core = { workspace = true }

[project.scripts]
pmgr-api = "prometheus_manager_api.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_manager_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

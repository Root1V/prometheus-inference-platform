[project]
name = "prometheus-manager-core"
version = "0.1.0"
description = "Prometheus Manager domain layer — registry, lifecycle, scanner, config, downloader"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    "tomllib>=2.0.1; python_version < '3.11'",
    "httpx>=0.27",
    "huggingface-hub>=0.23",
    "requests>=2.33.1",
    "truststore>=0.10.4",
    "structlog>=25.5.0",
    "prometheus-telemetry",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-psutil>=5.9",
    "types-requests>=2.33",
]

[tool.uv.sources]
prometheus-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_manager_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

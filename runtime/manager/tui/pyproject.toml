[project]
name = "prometheus-manager-tui"
version = "0.1.0"
description = "pmgr — Prometheus Manager CLI & Textual TUI, packaged for bare-metal install"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "textual>=0.61",
    "psutil>=5.9",
    "httpx>=0.27",
    "huggingface-hub>=0.23",
    "truststore>=0.10.4",
    "structlog>=25.5.0",
    "prometheus-telemetry",
    "prometheus-manager-core",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-psutil>=5.9",
]

[tool.uv.sources]
prometheus-telemetry = { workspace = true }
prometheus-manager-core = { workspace = true }

[project.scripts]
pmgr = "prometheus_manager_tui.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_manager_tui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
